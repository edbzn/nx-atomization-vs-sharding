# Downloads per-task and per-agent data of Nx Agents runs from the Nx Cloud API. No agents run.
#   gh workflow run collect-agents.yml -f runs="atomized-12-3=AbCdEf ..."
name: collect-agents

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Space-separated name=nxRunId pairs
        required: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
          RUNS: ${{ inputs.runs }}
        run: node bench/agents/collect.mjs $RUNS
      - uses: actions/upload-artifact@v4
        with:
          name: agents-data
          path: agents-data/
